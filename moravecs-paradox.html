<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Moravec's Paradox | Ethan Liu</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    .essay-container {
      width: 100%;
      margin: 2.2rem auto 3rem;
      padding: 0 1rem;
      text-align: left;
    }

    .essay-title {
      font-size: 1.32rem;
      font-family: 'Baskerville', 'Baskerville Old Face', 'Hoefler Text', 'Times New Roman', serif;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 0.55rem;
      letter-spacing: -0.3px;
    }

    .essay-meta {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 1.9rem;
      font-family: 'Baskerville', 'Baskerville Old Face', 'Hoefler Text', 'Times New Roman', serif;
    }

    .essay-content p {
      margin-bottom: 1.05rem;
      font-size: 1.14rem;
      line-height: 1.8;
      color: var(--text);
    }

    .essay-content h2 {
      font-size: 1.25rem;
      margin-top: 1.75rem;
      margin-bottom: 0.5rem;
      font-weight: 400;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .essay-content b, .essay-content strong {
      font-weight: 600;
      font-synthesis-weight: none;
    }

    .draft-placeholder {
      color: var(--muted);
      font-style: italic;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.8rem;
      color: var(--text);
      text-decoration: none;
      font-size: 0.92rem;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--muted);
      text-decoration: underline;
    }
  </style>
</head>
<body data-pond="off">
  <div class="page-wrapper page-essay-wide">
    <header class="header-container">
      <div class="header-top">
        <div class="theme-toggle" id="themeToggle">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/>
            <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/>
            <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"/>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="dropdown" id="dropdown">
          <button class="dropdown-btn" id="dropdownBtn">天</button>
          <div class="dropdown-content" id="dropdownContent">
            <a href="index.html">about</a>
            <a href="work.html">work</a>
            <a href="research.html">research</a>
            <a href="archive.html" style="color: var(--accent); text-decoration: underline;">archive</a>
            <a href="writing.html">writing</a>
          </div>
        </div>
      </div>
    </header>

    <div class="main-content">
      <div class="essay-container essay-wide">
        <a href="archive.html" class="back-link">&larr; back to archive</a>
        <h1 class="essay-title">Moravec's Paradox</h1>
        <div class="essay-meta">Ethan TS. Liu | May 2026</div>

        <div class="essay-content">
          <!-- Write the essay below. Replace this placeholder paragraph when ready. -->
          <p class="draft-placeholder">Draft goes here.</p>
        </div>
      </div>
    </div>

    <script>
      const themeToggle = document.getElementById('themeToggle');
      const sunIcon = document.querySelector('.sun-icon');
      const moonIcon = document.querySelector('.moon-icon');
      const currentTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', currentTheme);
      updateThemeIcon(currentTheme);

      themeToggle.addEventListener('click', () => {
        const theme = document.documentElement.getAttribute('data-theme');
        const newTheme = theme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
      });

      function updateThemeIcon(theme) {
        if (theme === 'dark') {
          sunIcon.style.display = 'block';
          moonIcon.style.display = 'none';
        } else {
          sunIcon.style.display = 'none';
          moonIcon.style.display = 'block';
        }
      }

      const dropdown = document.getElementById('dropdown');
      const dropdownContent = document.getElementById('dropdownContent');
      let timeoutId;

      function showDropdown() {
        clearTimeout(timeoutId);
        dropdownContent.style.display = 'block';
        dropdownContent.style.opacity = '1';
        dropdownContent.style.visibility = 'visible';
        dropdownContent.style.pointerEvents = 'auto';
      }

      function hideDropdown() {
        timeoutId = setTimeout(() => {
          dropdownContent.style.display = 'none';
          dropdownContent.style.opacity = '0';
          dropdownContent.style.visibility = 'hidden';
          dropdownContent.style.pointerEvents = 'none';
        }, 150);
      }

      dropdown.addEventListener('mouseenter', showDropdown);
      dropdown.addEventListener('mouseleave', hideDropdown);
      dropdownContent.addEventListener('mouseenter', showDropdown);
      dropdownContent.addEventListener('mouseleave', hideDropdown);
    </script>
  </div>
  <script src="background.js"></script>
</body>
</html>
