<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
  <div class="header-container">
    <div class="header-content">
      <div class="name-title">Ethan Liu</div>
      <div class="dropdown" id="dropdown">
        <button class="dropdown-btn" id="dropdownBtn">Menu</button>
        <div class="dropdown-content" id="dropdownContent">
          <a href="index.html">about</a>
          <a href="stuff.html">stuff</a>
          <a href="writing.html" style="color: var(--accent); text-decoration: underline;">writing</a>
        </div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="writing-list">
      <div class="writing-entry">
        <a href="friction.html" class="writing-title">friction and obsession</a>
        <div class="writing-meta">2025-6-10 &middot; 1 min read</div>
      </div>
      <!-- Add more entries below as needed -->
    </div>

    <footer>
      <p>
        Feel free to <a href="mailto:ethantsliu@berkeley.edu">reach out</a> if you're interested in collaborating or learning more about my work!
      </p>
    </footer>
  </div>

  <script>
    const dropdown = document.getElementById('dropdown');
    const dropdownBtn = document.getElementById('dropdownBtn');
    const dropdownContent = document.getElementById('dropdownContent');
    let timeoutId;

    function showDropdown() {
      clearTimeout(timeoutId);
      dropdownContent.style.display = 'block';
      dropdownContent.style.opacity = '1';
      dropdownContent.style.visibility = 'visible';
    }

    function hideDropdown() {
      timeoutId = setTimeout(() => {
        dropdownContent.style.display = 'none';
        dropdownContent.style.opacity = '0';
        dropdownContent.style.visibility = 'hidden';
      }, 150);
    }

    dropdown.addEventListener('mouseenter', showDropdown);
    dropdown.addEventListener('mouseleave', hideDropdown);
  </script>
</body>
</html>
